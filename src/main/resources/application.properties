spring.application.name=issue-tracker-backend

# Server port
server.port=8080

# Database Configuration for MS SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=issue_tracker_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=admin
spring.datasource.password=alyan
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Configuration
jwt.secret=your-very-secure-secret-key-here-minimum-256-bits
jwt.expiration=86400000

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO
logging.level.com.issuetracker=DEBUG